server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location = /health {
        proxy_pass http://backend:8000;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
